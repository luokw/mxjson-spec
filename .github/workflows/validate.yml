name: Validate Spec and Examples

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install validator dependencies
        run: |
          python -m pip install --upgrade pip
          pip install jsonschema

      - name: Validate JSON format
        run: |
          jq empty schema/mxjson.schema.json
          jq empty examples/contract-review/contract-review.mxjson
          jq empty examples/translator/translator.mxjson

      - name: Validate examples against schema
        run: python scripts/validate_examples.py
